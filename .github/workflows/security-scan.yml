name: Security Scan - .NET + OWASP ZAP

on:
  push:
    branches: [ feature/security-audit ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      # CONFIGURACIÓN PRINCIPAL - AJUSTA ESTAS VARIABLES SEGÚN TU PROYECTO
      APP_URL: http://localhost:5000
      APP_PROJECT: "./src/MyApi/MyApi.csproj"   # Ruta correcta a tu archivo .csproj
      STARTUP_TIMEOUT: 60

    steps:
    # Paso 1: Obtener el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # Paso 2: Configurar .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'    # Ajusta a la versión de .NET que uses

    # Paso 3: Verificar que el archivo del proyecto existe
    - name: Verify project file exists
      run: |
        echo "Buscando archivo del proyecto: ${{ env.APP_PROJECT }}"
        if [ ! -f "${{ env.APP_PROJECT }}" ]; then
          echo "❌ ERROR: El archivo del proyecto no existe: ${{ env.APP_PROJECT }}"
          echo "Archivos encontrados en el repositorio:"
          find . -name "*.csproj" -type f | head -20
          exit 1
        else
          echo "✅ Archivo del proyecto encontrado: ${{ env.APP_PROJECT }}"
        fi

    # Paso 4: Restaurar dependencias y compilar el proyecto
    - name: Restore and build
      run: |
        echo "Restaurando dependencias..."
        dotnet restore "${{ env.APP_PROJECT }}"
        echo "Compilando proyecto..."
        dotnet build "${{ env.APP_PROJECT }}" -c Release --no-restore

    # Paso 5: Análisis de dependencias vulnerables (Software Composition Analysis)
    - name: List vulnerable packages (SCA light)
      run: |
        echo "==== PAQUETES VULNERABLES ====" > vulnerabilities.txt
        echo "Fecha del análisis: $(date)" >> vulnerabilities.txt
        echo "" >> vulnerabilities.txt
        
        echo "Escaneando paquetes vulnerables..."
        dotnet list "${{ env.APP_PROJECT }}" package --vulnerable --include-transitive >> vulnerabilities.txt 2>&1 || echo "No se encontraron paquetes vulnerables" >> vulnerabilities.txt
        
        echo "" >> vulnerabilities.txt
        echo "==== PAQUETES DESACTUALIZADOS ====" >> vulnerabilities.txt
        echo "" >> vulnerabilities.txt
        
        echo "Escaneando paquetes desactualizados..."
        dotnet list "${{ env.APP_PROJECT }}" package --outdated --include-transitive >> vulnerabilities.txt 2>&1 || echo "No se encontraron paquetes desactualizados" >> vulnerabilities.txt
        
        echo "Análisis de dependencias completado"
        cat vulnerabilities.txt

    # Paso 6: Iniciar la aplicación en segundo plano
    - name: Start API in background
      run: |
        echo "Iniciando la aplicación en segundo plano..."
        
        # Inicia la API en segundo plano
        nohup dotnet run --project "${{ env.APP_PROJECT }}" --urls "${{ env.APP_URL }}" --configuration Release &> app.log &
        
        # Guarda el PID del proceso para poder terminarlo después
        echo $! > app.pid
        
        echo "Esperando que la aplicación esté disponible..."
        SECONDS=0
        while [ $SECONDS -lt ${{ env.STARTUP_TIMEOUT }} ]; do
          if curl -s -f "${{ env.APP_URL }}" > /dev/null 2>&1; then
            echo "✅ Aplicación disponible en ${{ env.APP_URL }} después de ${SECONDS}s"
            break
          fi
          sleep 2
        done
        
        # Verificación final
        if ! curl -s -f "${{ env.APP_URL }}" > /dev/null 2>&1; then
          echo "❌ ERROR: La aplicación no respondió en ${{ env.STARTUP_TIMEOUT }}s"
          echo "=== Últimas líneas del log de la aplicación ==="
          tail -50 app.log || true
          exit 1
        fi

    # Paso 7: Descargar imagen de OWASP ZAP
    - name: Pull OWASP ZAP image
      run: |
        echo "Descargando imagen de OWASP ZAP..."
        docker pull owasp/zap2docker-stable

    # Paso 8: Ejecutar escaneo de seguridad con OWASP ZAP
    - name: Run OWASP ZAP baseline scan
      run: |
        echo "Iniciando escaneo de seguridad con OWASP ZAP..."
        
        # Para contenedores Docker en GitHub Actions, usamos host.docker.internal
        TARGET="${{ env.APP_URL }}"
        
        echo "Objetivo del escaneo: $TARGET"
        
        # Ejecuta el escaneo baseline de ZAP
        docker run --rm \
          -v "$(pwd):/zap/wrk/:rw" \
          -t owasp/zap2docker-stable \
          zap-baseline.py -t "$TARGET" -r zap_report.html -J zap_report.json -I
        
        echo "Escaneo de ZAP completado"
        
        # Nota: El comando puede retornar códigos de salida diferentes a 0 para ciertas alertas
        # por eso usamos || true para evitar que falle el paso
      env:
        # Configuración de memoria para ZAP (opcional)
        ZAP_MAX_MEM: 2048m

    # Paso 9: Detener la aplicación
    - name: Stop API
      if: always()
      run: |
        echo "Deteniendo la aplicación..."
        if [ -f app.pid ]; then
          PID=$(cat app.pid)
          echo "Terminando proceso $PID"
          kill $PID 2>/dev/null || true
          rm -f app.pid
        fi
        # Asegurarse de que no queden procesos de dotnet
        pkill -f "dotnet run" 2>/dev/null || true

    # Paso 10: Guardar logs de la aplicación
    - name: Save app log
      if: always()
      run: |
        echo "Guardando logs de la aplicación..."
        if [ -f app.log ]; then
          echo "=== LOG DE LA APLICACIÓN ===" > application_logs.txt
          cat app.log >> application_logs.txt
          echo "Log guardado en application_logs.txt"
        else
          echo "No se encontró el archivo app.log"
        fi

    # Paso 11: Generar reporte resumen
    - name: Generate summary report
      if: always()
      run: |
        echo "Generando reporte resumen del escaneo..."
        
        echo "# REPORTE DE SEGURIDAD - RESUMEN EJECUTIVO" > security_summary.md
        echo "Fecha: $(date)" >> security_summary.md
        echo "Branch: ${{ github.ref }}" >> security_summary.md
        echo "Commit: ${{ github.sha }}" >> security_summary.md
        echo "" >> security_summary.md
        
        # Información de dependencias
        echo "## DEPENDENCIAS" >> security_summary.md
        if [ -f vulnerabilities.txt ]; then
          echo "✅ Análisis de dependencias completado" >> security_summary.md
          echo "Ver archivo: vulnerabilities.txt para detalles" >> security_summary.md
        else
          echo "❌ No se pudo generar análisis de dependencias" >> security_summary.md
        fi
        echo "" >> security_summary.md
        
        # Información de ZAP
        echo "## ESCANEO OWASP ZAP" >> security_summary.md
        if [ -f zap_report.json ]; then
          # Contar alertas por nivel de riesgo
          HIGH_CRITICAL=$(jq '[.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical")] | length' zap_report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.site[0].alerts[]? | select(.risk == "Medium")] | length' zap_report.json 2>/dev/null || echo "0")
          LOW_INFO=$(jq '[.site[0].alerts[]? | select(.risk == "Low" or .risk == "Informational")] | length' zap_report.json 2>/dev/null || echo "0")
          
          echo "Alertas High/Critical: $HIGH_CRITICAL" >> security_summary.md
          echo "Alertas Medium: $MEDIUM" >> security_summary.md
          echo "Alertas Low/Informational: $LOW_INFO" >> security_summary.md
          echo "✅ Reporte ZAP generado correctamente" >> security_summary.md
        else
          echo "❌ No se pudo generar reporte ZAP" >> security_summary.md
        fi
        echo "" >> security_summary.md
        
        echo "## ARCHIVOS DISPONIBLES" >> security_summary.md
        echo "- security_summary.md (este archivo)" >> security_summary.md
        echo "- vulnerabilities.txt (análisis de dependencias)" >> security_summary.md
        echo "- zap_report.html (reporte HTML de ZAP)" >> security_summary.md
        echo "- zap_report.json (reporte JSON de ZAP)" >> security_summary.md
        echo "- application_logs.txt (logs de la aplicación)" >> security_summary.md
        
        cat security_summary.md

    # Paso 12: Subir todos los reportes como artefactos
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-reports
        path: |
          security_summary.md
          vulnerabilities.txt
          zap_report.html
          zap_report.json
          application_logs.txt
        retention-days: 30

    # Paso 13: Fallar el job si hay alertas críticas (opcional)
    - name: Fail on critical ZAP alerts
      if: always()
      run: |
        echo "Evaluando alertas críticas..."
        
        if [ -f zap_report.json ]; then
          # Usar jq para contar alertas High/Critical
          CRITICAL_COUNT=$(jq '[.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical")] | length' zap_report.json 2>/dev/null || echo "0")
          
          echo "Alertas HIGH/CRITICAL encontradas: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ SE DETECTARON ALERTAS CRÍTICAS DE SEGURIDAD"
            echo "El job fallará debido a la presencia de vulnerabilidades HIGH/CRITICAL"
            
            # Mostrar detalles de las alertas críticas
            echo "=== DETALLES DE ALERTAS CRÍTICAS ==="
            jq '.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical") | {name, risk, url}' zap_report.json 2>/dev/null || true
            
            exit 1
          else
            echo "✅ No se encontraron alertas HIGH/CRITICAL"
          fi
        else
          echo "⚠️  No se encontró zap_report.json - no se puede evaluar gravedad"
          # No fallamos aquí porque puede ser un problema técnico, no de seguridad
        fi