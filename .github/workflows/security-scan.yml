name: Security Scan - .NET + OWASP ZAP

on:
  push:
    branches: [ feature/security-audit ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      # CONFIGURACIÓN PARA TU PROYECTO
      APP_URL: http://localhost:5000
      APP_PROJECT: "./Distribuidora_La_Central.Web/Distribuidora_La_Central.Web.csproj"   # Solo el proyecto Web
      STARTUP_TIMEOUT: 90  # Aumentado para dar más tiempo

    steps:
    # Paso 1: Obtener el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # Paso 2: Configurar .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'  # Usar 8.0.x que es más estable para Web APIs

    # Paso 3: Explorar estructura del proyecto
    - name: Explore project structure
      run: |
        echo "=== ESTRUCTURA DEL PROYECTO ==="
        find . -name "*.csproj" -type f
        echo ""
        echo "=== CONTENIDO DE CADA PROYECTO ==="
        for proj in $(find . -name "*.csproj"); do
          echo "🔍 Proyecto: $proj"
          echo "   Target Framework:"
          grep -oP '<TargetFramework>[^<]+' "$proj" | head -1 || echo "   No encontrado"
          echo "   Project Type:"
          grep -oP '<ProjectTypeGuids>[^<]+' "$proj" | head -1 || echo "   Standard/Web"
          echo ""
        done

    # Paso 4: Verificar que el archivo del proyecto Web existe
    - name: Verify project file exists
      run: |
        echo "Buscando archivo del proyecto: ${{ env.APP_PROJECT }}"
        if [ ! -f "${{ env.APP_PROJECT }}" ]; then
          echo "❌ ERROR: El archivo del proyecto no existe: ${{ env.APP_PROJECT }}"
          echo "Archivos .csproj encontrados en el repositorio:"
          find . -name "*.csproj" -type f
          exit 1
        else
          echo "✅ Archivo del proyecto encontrado: ${{ env.APP_PROJECT }}"
          echo "📋 Contenido del proyecto Web:"
          cat "${{ env.APP_PROJECT }}" | grep -E "(TargetFramework|ProjectSdk|PackageReference)" | head -10
        fi

    # Paso 5: Restaurar SOLO el proyecto Web (evitar MAUI/Android)
    - name: Restore Web project only
      run: |
        echo "Restaurando dependencias SOLO del proyecto Web..."
        dotnet restore "${{ env.APP_PROJECT }}" --verbosity minimal
        
        echo "✅ Restauración completada del proyecto Web"

    # Paso 6: Compilar SOLO el proyecto Web
    - name: Build Web project only
      run: |
        echo "Compilando SOLO el proyecto Web..."
        dotnet build "${{ env.APP_PROJECT }}" -c Release --no-restore --verbosity minimal
        
        echo "✅ Compilación del proyecto Web completada"

    # Paso 7: Análisis de dependencias vulnerables para el proyecto web
    - name: List vulnerable packages (SCA light)
      run: |
        echo "==== ANÁLISIS DE DEPENDENCIAS - PROYECTO WEB ====" > vulnerabilities.txt
        echo "Fecha del análisis: $(date)" >> vulnerabilities.txt
        echo "Proyecto: ${{ env.APP_PROJECT }}" >> vulnerabilities.txt
        echo "" >> vulnerabilities.txt
        
        echo "Escaneando paquetes vulnerables..."
        echo "==== PAQUETES VULNERABLES ====" >> vulnerabilities.txt
        dotnet list "${{ env.APP_PROJECT }}" package --vulnerable --include-transitive >> vulnerabilities.txt 2>&1 || echo "No se encontraron paquetes vulnerables" >> vulnerabilities.txt
        
        echo "" >> vulnerabilities.txt
        echo "==== PAQUETES DESACTUALIZADOS ====" >> vulnerabilities.txt
        dotnet list "${{ env.APP_PROJECT }}" package --outdated --include-transitive >> vulnerabilities.txt 2>&1 || echo "No se encontraron paquetes desactualizados" >> vulnerabilities.txt
        
        echo "Análisis de dependencias completado"
        echo "=== RESUMEN DE VULNERABILIDADES ==="
        grep -E "(vulnerable|outdated|HIGH|CRITICAL)" vulnerabilities.txt || echo "No se encontraron problemas críticos"

    # Paso 8: Iniciar la aplicación web en segundo plano
    - name: Start Web API in background
      run: |
        echo "Iniciando la aplicación Web/API en segundo plano..."
        
        # Verificar variables de entorno
        echo "APP_URL: ${{ env.APP_URL }}"
        echo "APP_PROJECT: ${{ env.APP_PROJECT }}"
        
        # Inicia el proyecto Web en segundo plano
        echo "Ejecutando: dotnet run --project ${{ env.APP_PROJECT }} --urls ${{ env.APP_URL }} --configuration Release"
        nohup dotnet run --project "${{ env.APP_PROJECT }}" --urls "${{ env.APP_URL }}" --configuration Release &> app.log &
        
        # Guarda el PID del proceso
        echo $! > app.pid
        echo "PID del proceso: $(cat app.pid)"
        
        echo "Esperando que la aplicación Web esté disponible en ${{ env.APP_URL }}..."
        SECONDS=0
        MAX_WAIT=${{ env.STARTUP_TIMEOUT }}
        
        while [ $SECONDS -lt $MAX_WAIT ]; do
          if curl -s -f "${{ env.APP_URL }}" > /dev/null 2>&1; then
            echo "✅ Aplicación Web disponible en ${{ env.APP_URL }} después de ${SECONDS}s"
            echo "=== Verificando respuesta HTTP ==="
            curl -s -I "${{ env.APP_URL }}" | head -5 || true
            break
          fi
          echo "Esperando... (${SECONDS}s)"
          sleep 5
        done
        
        # Verificación final
        if ! curl -s -f "${{ env.APP_URL }}" > /dev/null 2>&1; then
          echo "❌ ERROR: La aplicación Web no respondió en $MAX_WAIT segundos"
          echo "=== Últimas 30 líneas del log ==="
          tail -30 app.log || true
          echo "=== Procesos dotnet en ejecución ==="
          ps aux | grep dotnet || true
          echo "=== Puertos en uso ==="
          netstat -tulpn 2>/dev/null || ss -tulpn 2>/dev/null || true
          exit 1
        fi

    # Paso 9: Descargar imagen de OWASP ZAP
    - name: Pull OWASP ZAP image
      run: |
        echo "Descargando imagen de OWASP ZAP..."
        docker pull owasp/zap2docker-stable

    # Paso 10: Ejecutar escaneo de seguridad con OWASP ZAP
    - name: Run OWASP ZAP baseline scan
      run: |
        echo "Iniciando escaneo de seguridad con OWASP ZAP..."
        
        TARGET="${{ env.APP_URL }}"
        echo "Objetivo del escaneo: $TARGET"
        
        # Crear directorio para reportes si no existe
        mkdir -p zap-reports
        
        # Ejecuta el escaneo baseline de ZAP
        docker run --rm \
          -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
          -t owasp/zap2docker-stable \
          zap-baseline.py -t "$TARGET" -r zap_report.html -J zap_report.json -I -c zap-config.conf || true
        
        # Mover reportes al directorio principal
        mv zap-reports/* . 2>/dev/null || true
        
        echo "Escaneo de ZAP completado"
        
      env:
        ZAP_MAX_MEM: 2048m

    # Paso 11: Detener la aplicación
    - name: Stop API
      if: always()
      run: |
        echo "Deteniendo la aplicación Web..."
        if [ -f app.pid ]; then
          PID=$(cat app.pid)
          echo "Terminando proceso $PID"
          kill $PID 2>/dev/null || true
          sleep 5
          # Verificar si el proceso sigue ejecutándose
          if ps -p $PID > /dev/null 2>&1; then
            echo "Forzando terminación del proceso $PID"
            kill -9 $PID 2>/dev/null || true
          fi
          rm -f app.pid
        fi
        # Limpiar procesos de dotnet
        pkill -f "dotnet run" 2>/dev/null || true
        echo "Limpieza de procesos completada"

    # Paso 12: Guardar logs de la aplicación
    - name: Save app log
      if: always()
      run: |
        echo "Guardando logs de la aplicación..."
        if [ -f app.log ]; then
          echo "=== LOG DE LA APLICACIÓN WEB ===" > application_logs.txt
          echo "Proyecto: ${{ env.APP_PROJECT }}" >> application_logs.txt
          echo "URL: ${{ env.APP_URL }}" >> application_logs.txt
          echo "Fecha: $(date)" >> application_logs.txt
          echo "" >> application_logs.txt
          cat app.log >> application_logs.txt
          echo "✅ Log guardado en application_logs.txt"
        else
          echo "No se encontró el archivo app.log" > application_logs.txt
        fi

    # Paso 13: Generar reporte resumen
    - name: Generate summary report
      if: always()
      run: |
        echo "Generando reporte resumen del escaneo..."
        
        echo "# 🛡️ REPORTE DE SEGURIDAD - DISTRIBUIDORA LA CENTRAL" > security_summary.md
        echo "" >> security_summary.md
        echo "## 📋 INFORMACIÓN DEL ESCANEO" >> security_summary.md
        echo "- **Proyecto Analizado:** \`${{ env.APP_PROJECT }}\`" >> security_summary.md
        echo "- **URL Escaneada:** ${{ env.APP_URL }}" >> security_summary.md
        echo "- **Fecha:** $(date)" >> security_summary.md
        echo "- **Branch:** ${{ github.ref }}" >> security_summary.md
        echo "- **Commit:** ${{ github.sha }}" >> security_summary.md
        echo "" >> security_summary.md
        
        # Información de dependencias
        echo "## 📦 ANÁLISIS DE DEPENDENCIAS" >> security_summary.md
        if [ -f vulnerabilities.txt ]; then
          if grep -q "vulnerable" vulnerabilities.txt; then
            echo "⚠️  **Se encontraron dependencias vulnerables**" >> security_summary.md
          else
            echo "✅ **No se encontraron dependencias vulnerables críticas**" >> security_summary.md
          fi
          echo "Ver archivo \`vulnerabilities.txt\` para detalles completos" >> security_summary.md
        else
          echo "❌ No se pudo generar análisis de dependencias" >> security_summary.md
        fi
        echo "" >> security_summary.md
        
        # Información de ZAP
        echo "## 🔒 ESCANEO OWASP ZAP" >> security_summary.md
        if [ -f zap_report.json ]; then
          HIGH_CRITICAL=$(jq '[.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical")] | length' zap_report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.site[0].alerts[]? | select(.risk == "Medium")] | length' zap_report.json 2>/dev/null || echo "0")
          LOW_INFO=$(jq '[.site[0].alerts[]? | select(.risk == "Low" or .risk == "Informational")] | length' zap_report.json 2>/dev/null || echo "0")
          
          echo "### Resumen de Alertas" >> security_summary.md
          echo "| Nivel de Riesgo | Cantidad | Estado |" >> security_summary.md
          echo "|----------------|----------|--------|" >> security_summary.md
          echo "| 🔴 High/Critical | $HIGH_CRITICAL | $( [ "$HIGH_CRITICAL" -eq 0 ] && echo "✅" || echo "❌" ) |" >> security_summary.md
          echo "| 🟡 Medium | $MEDIUM | $( [ "$MEDIUM" -eq 0 ] && echo "✅" || echo "⚠️" ) |" >> security_summary.md
          echo "| 🔵 Low/Informational | $LOW_INFO | ℹ️ |" >> security_summary.md
          echo "" >> security_summary.md
          echo "✅ **Reporte ZAP generado correctamente**" >> security_summary.md
        else
          echo "❌ No se pudo generar reporte ZAP" >> security_summary.md
        fi
        echo "" >> security_summary.md
        
        echo "## 📁 ARCHIVOS GENERADOS" >> security_summary.md
        echo "- \`security_summary.md\` - Este resumen ejecutivo" >> security_summary.md
        echo "- \`vulnerabilities.txt\` - Análisis de dependencias" >> security_summary.md
        echo "- \`zap_report.html\` - Reporte visual de OWASP ZAP" >> security_summary.md
        echo "- \`zap_report.json\` - Reporte técnico de OWASP ZAP" >> security_summary.md
        echo "- \`application_logs.txt\` - Logs de ejecución" >> security_summary.md
        echo "" >> security_summary.md
        
        echo "=== RESUMEN EJECUTIVO ==="
        cat security_summary.md

    # Paso 14: Subir todos los reportes como artefactos
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-reports
        path: |
          security_summary.md
          vulnerabilities.txt
          zap_report.html
          zap_report.json
          application_logs.txt
        retention-days: 30

    # Paso 15: Fallar el job si hay alertas críticas
    - name: Fail on critical ZAP alerts
      if: always()
      run: |
        echo "Evaluando alertas críticas de seguridad..."
        
        if [ -f zap_report.json ]; then
          CRITICAL_COUNT=$(jq '[.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical")] | length' zap_report.json 2>/dev/null || echo "0")
          
          echo "🔍 Alertas HIGH/CRITICAL encontradas: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ SE DETECTARON ALERTAS CRÍTICAS DE SEGURIDAD"
            echo "=== DETALLES DE ALERTAS CRÍTICAS ==="
            jq '.site[0].alerts[]? | select(.risk == "High" or .risk == "Critical") | {name, risk, url, description}' zap_report.json 2>/dev/null || true
            echo ""
            echo "🚨 EL JOB FALLARÁ DEBIDO A VULNERABILIDADES CRÍTICAS"
            exit 1
          else
            echo "✅ No se encontraron alertas HIGH/CRITICAL - Estado de seguridad ACEPTABLE"
          fi
        else
          echo "⚠️  No se encontró zap_report.json - no se puede evaluar gravedad automáticamente"
        fi